    <title>Clarky.ca - Inbound Transmission</title>
    <style>
        /* Dark Mode by default - No white screens allowed */
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Stops the "buggy" scrollbars */
            font-family: 'Courier New', Courier, monospace;
        }

        .space-void {
            text-align: center;
            color: #00ff66; /* Terminal green vibe, or use #fff for pure white */

        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        p {
            color: #888;
            font-size: 1rem;
            margin: 0;
            letter-spacing: 1px;
        }
    </style>
</head>

    <div class="space-void">
